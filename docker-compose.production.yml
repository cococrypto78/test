# PostgreSQL et Redis tournent sur le HOST (pas en conteneur).
# Accessible depuis les conteneurs via 10.0.1.1 (gateway du réseau Coolify).
# DATABASE_URL et REDIS_URL dans .env doivent pointer sur 10.0.1.1.

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  volumes:
    - app-code:/app
    - app-logs:/var/log/sales-agent
  networks:
    - coolify
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  web:
    <<: *common
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000 --workers 4 --log-level info
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sales-agent.rule=Host(`app.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.sales-agent.tls=true"
      - "traefik.http.routers.sales-agent.tls.certresolver=letsencrypt"
      - "traefik.http.services.sales-agent.loadbalancer.server.port=8000"

  worker:
    <<: *common
    command: celery -A tasks.celery_app worker --concurrency=4 --loglevel=info --logfile=/var/log/sales-agent/celery-worker.log

  beat:
    <<: *common
    command: celery -A tasks.celery_app beat --loglevel=info --logfile=/var/log/sales-agent/celery-beat.log

volumes:
  app-code:
  app-logs:

networks:
  coolify:
    external: true
